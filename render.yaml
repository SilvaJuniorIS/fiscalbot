services:
  - type: web
    name: fiscalbot-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c 'alembic upgrade head && python -m scripts.bootstrap_admin && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CELERY_ENABLED
        value: "false"
      - key: STORAGE_PATH
        value: /tmp/fiscalbot-storage
      - key: FRONTEND_URL
        value: https://fiscalbot-isj.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
