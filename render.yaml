services:
  - type: web
    name: fiscalbot-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerCommand: /bin/sh /app/scripts/start_render.sh
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CELERY_ENABLED
        value: "false"
      - key: STORAGE_PATH
        value: /tmp/fiscalbot-storage
      - key: FRONTEND_URL
        value: https://fiscalbot-isj.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
